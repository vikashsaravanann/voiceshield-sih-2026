services:
  - type: web
    name: voiceshield-api
    env: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: DEVICE
        value: cpu
      - key: ENABLE_FP16
        value: "false"
      - key: ENABLE_AUDIT_LOGGING
        value: "true"
      - key: STORE_RAW_AUDIO
        value: "false"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://voiceshield-live.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
