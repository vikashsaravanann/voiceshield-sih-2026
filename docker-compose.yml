services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DEVICE: cpu
      STORE_RAW_AUDIO: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      retries: 6
